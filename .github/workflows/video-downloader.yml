name: Video Downloader APK
on:
  push:
    branches: [video-downloader-android]
    paths: ['video-downloader/**', '.github/workflows/video-downloader.yml']
  pull_request:
    paths: ['video-downloader/**', '.github/workflows/video-downloader.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-downloader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: video-downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android toolchain and fixture tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.1.13356709'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg ninja-build
      - name: Python dependency and policy tests
        run: |
          python -m pip install yt-dlp==2026.8.19 yt-dlp-ejs==0.8.0 requests==2.32.5 certifi==2026.7.22
          python -m unittest discover -s tests -v
      - name: Build Android FFmpeg and QuickJS from source
        run: bash scripts/build-native.sh
      - name: Generate audio/video fixtures
        run: bash scripts/make-fixtures.sh
      - name: Compile, lint and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-Debug-APK
          path: video-downloader/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Android runtime compatibility, merge and MediaStore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: video-downloader
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload tests and reproducible native sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-Verification
          path: |
            video-downloader/app/build/reports/
            video-downloader/app/build/outputs/androidTest-results/
            video-downloader/.native/*.tar.*
            video-downloader/.native/SOURCE_SHA256.txt
            video-downloader/.native/elf-*.txt
          retention-days: 30
